<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>코우 키우기 — 열세 가지 미래</title><style>*{box-sizing:border-box}body{margin:0;background:#131522;color:#f5f0f6;font-family:system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;min-height:100dvh;padding:22px 18px 40px;background:linear-gradient(#272b45,#171928)}h1{font-size:25px;margin:10px 0 4px}small,.sub{color:#b9b5c8}.panel{background:#ffffff0d;border:1px solid #ffffff24;border-radius:17px;padding:17px;margin-top:17px}.scene{height:205px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 90%,#5c648a,#242b45 67%);border-radius:13px;overflow:hidden;position:relative}.scene:before{content:'✦   ✧       ✦';position:absolute;top:16px;color:#b8c3ff;font-size:21px}.avatar{font-size:84px;filter:drop-shadow(0 8px 6px #101320);transition:.3s}.ground{position:absolute;bottom:0;background:#1d2135;height:22px;width:100%}.stage{color:#d4b5e8;font-size:13px;font-weight:700;letter-spacing:.08em}.dialog{font-size:17px;line-height:1.8;white-space:pre-line;min-height:85px}.choices{display:grid;gap:9px;margin-top:15px}button{font:inherit;text-align:left;border:1px solid #9994bb66;border-radius:12px;background:#373b5b;color:white;padding:14px 15px;cursor:pointer}button:active{background:#5a527c}button.secondary{background:transparent;color:#c6c3d4;font-size:13px;padding:10px 13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:12px}.stat{background:#171a2a;padding:9px;border-radius:9px}.track{height:5px;background:#4a4960;border-radius:9px;margin-top:7px}.fill{height:100%;background:#bca4e5;border-radius:9px}.end{font-size:24px;color:#e6c4f0}.note{font-size:12px;color:#aba6bf;line-height:1.7}.top{display:flex;justify-content:space-between;align-items:center}</style></head><body><main><div class="top"><small>SHU × KOU / GROWING STORY</small><div style="display:flex;gap:6px"><button class="secondary" onclick="showCollection()">엔딩 도감</button><button class="secondary" onclick="restart()">처음부터</button></div></div><h1>코우 키우기</h1><div class="sub">어린 코우의 열세 가지 미래</div><section class="panel"><div class="stage" id="stage"></div><div class="scene"><div class="avatar" id="avatar">🧒🏻</div><div class="ground"></div></div><div class="stats" id="stats" style="margin-top:12px"></div></section><section class="panel"><div class="dialog" id="dialog"></div><div class="choices" id="choices"></div></section><p class="note">선택은 이 기기에 자동 저장돼. 3개의 성장 시기, 12개의 사건, 성장 엔딩 10개와 데드 엔딩 3개가 있어. 엔딩을 보고 다시 키우면서 다른 미래를 찾아봐.</p></main><script>
const KEY='kou-grow-v2';const labels=['다정함','용기','지략','자유','야망','유대'];const chapters=[
{age:'유년기 · 7세',q:'비 오는 골목에서 어린 코우가 너를 올려다본다.\n“슈! 나 오늘은 뭐 하고 놀아?”',a:[['길 잃은 강아지를 함께 돌본다',[2,0,0,0,0,1]],['모험을 떠나자고 한다',[0,2,0,1,0,0]],['퍼즐을 함께 푼다',[0,0,2,0,0,1]]]},
{age:'유년기 · 8세',q:'코우가 친구와 다투고 돌아왔다.\n“나만 잘못한 것도 아닌데!”',a:[['상대의 마음도 들어 보자',[2,0,0,0,0,1]],['당당하게 자기 생각을 말하라고 한다',[0,2,0,0,1,0]],['왜 다퉜는지 차근차근 정리한다',[0,0,2,0,0,0]]]},
{age:'유년기 · 9세',q:'코우가 낡은 지도를 발견했다.\n“이거 진짜 보물지도일까?”',a:[['함께 지도 속 장소를 찾아간다',[0,1,0,2,0,1]],['안전한 길부터 계획한다',[0,0,2,0,0,1]],['위험하니 돌아가자고 한다',[2,0,0,0,0,0]]]},
{age:'유년기 · 10세',q:'코우가 생일 선물로 작은 나침반을 받았다.\n“슈, 이거 어디에 쓰면 좋을까?”',a:[['언제든 돌아올 길을 찾으라고 한다',[1,0,0,1,0,2]],['미지의 곳을 탐험하라고 한다',[0,1,0,2,0,0]],['남보다 먼저 목표에 도착하라고 한다',[0,1,0,0,2,0]]]},
{age:'소년기 · 13세',q:'훈련장에서 코우가 첫 패배를 맛봤다.\n“한 번만 더 하면 이길 수 있는데!”',a:[['넘어져도 다시 일어서라고 격려한다',[0,2,0,0,0,1]],['상대의 움직임을 분석한다',[0,0,2,0,0,0]],['승리보다 몸이 먼저라고 말한다',[2,0,0,0,0,0]],['슈가 숨긴 위험한 물건을 몰래 가져가 장난친다',null,0]]},
{age:'소년기 · 14세',q:'코우가 혼자 여행을 가고 싶다고 한다.\n“나도 이제 혼자 할 수 있어!”',a:[['믿고 보내 준다',[0,0,0,2,0,1]],['안전한 계획을 함께 짠다',[0,0,2,1,0,1]],['함께 가자고 제안한다',[1,0,0,0,0,2]]]},
{age:'소년기 · 15세',q:'위험한 상황에서 코우의 친구가 뒤처졌다.\n“슈, 어떻게 해야 하지?”',a:[['친구를 구하러 돌아간다',[2,2,0,0,0,0]],['모두 살아남을 경로를 계산한다',[1,0,2,0,0,0]],['목표를 우선하고 전진한다',[0,0,0,0,2,0]]]},
{age:'소년기 · 16세',q:'코우가 힘을 얻을 수 있는 비밀 조직의 제안을 받았다.\n“여기 들어가면 강해질 수 있대.”',a:[['힘에는 책임이 따른다고 말한다',[2,0,0,0,0,1]],['정보를 얻되 거리를 둔다',[0,0,2,0,1,0]],['강해질 기회를 잡으라고 한다',[0,1,0,0,2,0]],['슈를 곤란하게 만들려고 비밀을 넘긴다',null,1]]},
{age:'청년기 · 18세',q:'코우가 첫 임무를 앞두고 장비를 점검한다.\n“슈, 내가 잘할 수 있을까?”',a:[['네가 어떤 사람이든 곁에 있겠다고 한다',[1,0,0,0,0,3]],['네가 지킬 사람들을 생각하라고 한다',[2,2,0,0,0,0]],['이기는 방법을 알려 준다',[0,0,2,0,1,0]]]},
{age:'청년기 · 19세',q:'코우 앞에 서로 다른 세 개의 길이 놓였다.\n“어느 쪽이 나한테 어울려?”',a:[['사람들을 돕는 길',[2,1,0,0,0,0]],['혼자 세상을 떠도는 길',[0,0,0,3,0,0]],['힘을 쌓아 정상에 서는 길',[0,0,0,0,3,0]]]},
{age:'청년기 · 20세',q:'코우가 중요한 작전을 위해 너와 의견이 갈렸다.\n“슈, 이번만큼은 내 방식대로 하고 싶어.”',a:[['그의 결정을 믿는다',[0,0,0,1,0,2]],['함께 더 좋은 작전을 세운다',[0,0,3,0,0,1]],['확실한 승리를 위해 통제한다',[0,0,0,0,3,-2]],['슈를 일부러 위협하며 한계를 시험한다',null,2]]},
{age:'성인기 · 21세',q:'마지막 밤. 코우가 너에게 묻는다.\n“슈. 나는 어떤 사람이 된 것 같아?”',a:[['내게 가장 소중한 파트너',[0,0,0,0,0,3]],['스스로 미래를 선택할 수 있는 사람',[0,0,0,2,0,1]],['누구도 함부로 못 하는 강한 사람',[0,1,0,0,3,0]]]}];
const endings=[['평범한 행복','코우는 소박한 하루를 선택했다. 오늘도 웃으며 슈에게 손을 흔든다.'],['최고의 파트너','어떤 위기에도 두 사람은 서로를 믿는다. 코우는 슈의 곁에서 가장 단단해졌다.'],['전장의 영웅','코우는 누군가를 지키기 위해 앞장선다. 그의 이름은 오래도록 기억된다.'],['고독한 용병','코우는 누구의 명령도 따르지 않는다. 바람처럼 나타나고 사라지는 용병이 된다.'],['천재 전략가','코우는 힘보다 판단으로 전장을 움직인다. 누구도 그의 다음 수를 읽지 못한다.'],['자유로운 방랑자','코우는 지도를 접어 주머니에 넣는다. 세상 전체가 그의 다음 목적지다.'],['어둠의 지배자','코우는 힘으로 질서를 세운다. 모두가 그를 두려워하지만 그의 곁은 조용하다.'],['부서진 약속','함께하자는 약속은 어긋났다. 코우는 뒤돌아보지 않고 먼 길을 떠난다.'],['집착의 끝','코우에게 남은 것은 슈를 잃지 않겠다는 마음뿐이다. 그 마음은 점점 세상을 좁힌다.'],['비밀 엔딩 · 다시 만난 봄','수많은 갈림길을 지나도 코우는 자신을 잃지 않았다. 봄날, 그는 슈에게 웃으며 말한다. “나 잘 컸지?”']];
const deadEnds=[['잘못된 호기심','그렇게 궁금했어?','슈의 표정에서 웃음기가 사라졌다. 코우의 이야기는 여기서 끝났다.'],['배신의 대가','네가 그랬구나.','슈는 이미 모든 것을 알고 있었다. 그날 이후 코우의 미래는 오지 않았다.'],['마지막 도발','거기까지 해.','코우는 슈의 한계를 시험했다. 화면이 어두워지고 모든 소리가 멎었다.']];
let collection=[];try{collection=JSON.parse(localStorage.getItem('kou-grow-collection')||'[]')}catch(e){}if(!Array.isArray(collection))collection=[];function record(id){if(!collection.includes(id)){collection.push(id);try{localStorage.setItem('kou-grow-collection',JSON.stringify(collection))}catch(e){}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.s)||state.s.length!==6)state={i:0,s:[0,0,0,0,0,0],history:[],dead:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function ending(){let [kind,brave,smart,free,power,bond]=state.s;if(kind>=9&&brave>=6&&smart>=6&&bond>=9&&power<=8)return 9;if(bond<=-1)return 7;if(power>=12&&bond>=7)return 8;if(power>=12)return 6;if(bond>=12)return 1;if(kind>=10&&brave>=8)return 2;if(smart>=10)return 4;if(free>=11)return 5;if(brave>=10&&bond<=5)return 3;return 0}
function render(){let died=Number.isInteger(state.dead);let done=state.i>=chapters.length;document.getElementById('stage').textContent=died?'DEAD END':done?'성장 완료 · 엔딩':chapters[state.i].age;document.getElementById('avatar').textContent=died?'✖':done?'🧑🏻‍🦳':state.i<4?'🧒🏻':state.i<8?'👦🏻':'🧑🏻‍🦳';document.getElementById('stats').innerHTML=labels.map((x,j)=>`<div class="stat">${x} ${state.s[j]}<div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,state.s[j]*6+10))}%"></div></div></div>`).join('');let box=document.getElementById('choices');box.innerHTML='';let line=document.getElementById('dialog');if(died){let e=state.dead;line.innerHTML=`<div class="end" style="color:#ff9baf">DEAD END 0${e+1} · ${deadEnds[e][0]}</div><p>슈: “${deadEnds[e][1]}”</p><p>${deadEnds[e][2]}</p><p>코우는 슈에게 살해당했다.</p>`;add('처음부터 다시 키우기',restart);add('엔딩 도감 보기',showCollection);return}if(done){let e=ending();record('g'+e);line.innerHTML=`<div class="end">END ${String(e+1).padStart(2,'0')} · ${endings[e][0]}</div><p>${endings[e][1]}</p>`;add('다른 미래 키우기',restart);add('엔딩 도감 보기',showCollection);return}let c=chapters[state.i];line.textContent=c.q;c.a.forEach(([t,d,jdead],j)=>add(t,()=>{if(Number.isInteger(jdead)){state.dead=jdead;record('d'+jdead);save();render();return}state.s=state.s.map((v,k)=>v+d[k]);state.history.push(j);state.i++;save();render()}))}
function showCollection(){const names=[...endings.map(e=>e[0]),...deadEnds.map(e=>e[0])];const found=names.map((name,i)=>collection.includes((i<10?'g'+i:'d'+(i-10)))?name:'???');alert('엔딩 도감 ('+collection.length+'/13)\n\n'+found.map((x,i)=>String(i+1).padStart(2,'0')+'. '+x).join('\n'))}function add(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;document.getElementById('choices').appendChild(b)}function restart(){if(state.i<chapters.length&&!confirm('지금까지의 성장을 지우고 다시 시작할까?'))return;state={i:0,s:[0,0,0,0,0,0],history:[],dead:null};save();render()}render();
</script></body></html>
